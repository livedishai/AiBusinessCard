<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bakery & Cake AR Experience | Indian Bakery</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #blackCurtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #loader {
      color: white;
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Video Control Panel */
    .button-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
    }

    .plan-button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #d35400 0%, #c0392b 100%);
      color: #fff;
      cursor: pointer;
      min-width: 160px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .plan-button:active {
      transform: scale(0.96);
    }

    /* Top Floating Bakery Contact & Order Bar */
    #quickActionBar {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      z-index: 1000;
      background: rgba(20, 20, 20, 0.8);
      padding: 8px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: fadeInDown 0.4s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .action-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-icon-btn:hover {
      background: #e67e22;
      transform: translateY(-2px);
    }

    /* Cake Flavor Picker Controls */
    #flavorPicker {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .flavor-btn {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      color: #fff;
      transition: transform 0.2s;
    }

    .flv-choco { background: #3d2314; }
    .flv-velvet { background: #8e1a24; }
    .flv-vanilla { background: #f5eedc; color: #222; }

    .flavor-btn:active {
      transform: scale(0.92);
    }

    /* Interactive Candle Blow / Light Button */
    #candleToggleBtn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      width: 50px;
      height: 50px;
      z-index: 1000;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      font-size: 24px;
      border: 3px solid #e67e22;
      transition: transform 0.2s;
    }

    #candleToggleBtn:active {
      transform: scale(0.9);
    }

    #instagramButton {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 48px;
      height: 48px;
      z-index: 1000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none;
    }

    #instagramButton img {
      width: 32px;
      height: 32px;
    }

    /* REMOVE A-FRAME VR BUTTON COMPLETELY */
    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="blackCurtain">
    <div id="loader">Baking Your AR Experience...</div>
  </div>

  <!-- Bakery Action Hub -->
  <div id="quickActionBar">
    <a href="https://wa.me/919999999999?text=Hi%20Indian%20Bakery,%20I%20would%20like%20to%20order%20a%20cake!" target="_blank" class="action-icon-btn" title="Order Cake on WhatsApp">🎂</a>
    <a href="tel:+919999999999" class="action-icon-btn" title="Call Bakery">📞</a>
    <button id="saveContactBtn" class="action-icon-btn" title="Save Bakery Contact">👤</button>
    <a href="https://maps.google.com/?q=Indian+Bakery+Coonoor" target="_blank" class="action-icon-btn" title="Bakery Location">📍</a>
    <a href="https://indianbakerycoonoor.com" target="_blank" class="action-icon-btn" title="Menu & Catalog">📜</a>
  </div>

  <!-- 3D Cake Flavor Customizer -->
  <div id="flavorPicker">
    <button class="flavor-btn flv-choco" onclick="setCakeFlavor('#3D2314', '#5A331E')">Chocolate</button>
    <button class="flavor-btn flv-velvet" onclick="setCakeFlavor('#8E1A24', '#C0392B')">Red Velvet</button>
    <button class="flavor-btn flv-vanilla" onclick="setCakeFlavor('#FFF8DC', '#F0E68C')">Vanilla Cream</button>
  </div>

  <!-- Light / Blow Candle Button -->
  <button id="candleToggleBtn" title="Toggle Candle Flame">🕯️</button>

  <a href="https://www.instagram.com/overlay_gifts_ai/" target="_blank" id="instagramButton">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
  </a>

  <div class="button-panel" id="planButtons">
    <button class="plan-button" id="toggleButton">▶️ Play Video</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true; preserveDrawingBuffer: true">

    <a-assets>
      <video
        id="driveVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      
      <!-- Video Surface (Untouched) -->
      <a-plane
        id="videoPlane"
        width="1"
        height="1"
        visible="false"
        material="src: #driveVideo; side: double; transparent: true">
      </a-plane>

      <!-- 3D Interactive Celebration Cake (Floating over Top Edge of Card) -->
      <a-entity id="cakeGroup" position="0 0.65 0.12" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        
        <!-- Base Cake Stand -->
        <a-cylinder radius="0.22" height="0.02" material="color: #ECEFF1; metalness: 0.7; roughness: 0.2" position="0 -0.01 0"></a-cylinder>

        <!-- Tier 1 (Base Layer) -->
        <a-cylinder id="cakeTier1" radius="0.18" height="0.10" position="0 0.05 0" material="color: #3D2314; roughness: 0.4"></a-cylinder>

        <!-- Tier 2 (Middle Layer) -->
        <a-cylinder id="cakeTier2" radius="0.13" height="0.08" position="0 0.14 0" material="color: #5A331E; roughness: 0.4"></a-cylinder>

        <!-- Tier 3 (Top Layer) -->
        <a-cylinder id="cakeTier3" radius="0.08" height="0.06" position="0 0.21 0" material="color: #3D2314; roughness: 0.4"></a-cylinder>

        <!-- Cream / Cherry Toppings -->
        <a-sphere radius="0.016" position="0 0.25 0.05" material="color: #D32F2F; roughness: 0.1"></a-sphere>
        <a-sphere radius="0.016" position="0.05 0.25 0" material="color: #D32F2F; roughness: 0.1"></a-sphere>
        <a-sphere radius="0.016" position="-0.05 0.25 0" material="color: #D32F2F; roughness: 0.1"></a-sphere>

        <!-- Birthday Candle & Flame -->
        <a-cylinder radius="0.008" height="0.06" position="0 0.27 0" material="color: #FFFFFF; roughness: 0.2"></a-cylinder>
        <a-sphere
          id="candleFlame"
          radius="0.015"
          position="0 0.31 0"
          material="color: #FFB300; emissive: #FF6D00; emissiveIntensity: 1; opacity: 0.95"
          animation="property: scale; to: 1.3 1.6 1.3; dir: alternate; loop: true; dur: 400">
        </a-sphere>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
    const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";

    // Dynamic Cake Flavor Switcher
    function setCakeFlavor(baseColor, secondaryColor) {
      const tier1 = document.querySelector("#cakeTier1");
      const tier2 = document.querySelector("#cakeTier2");
      const tier3 = document.querySelector("#cakeTier3");

      if (tier1) tier1.setAttribute("material", "color", baseColor);
      if (tier2) tier2.setAttribute("material", "color", secondaryColor);
      if (tier3) tier3.setAttribute("material", "color", baseColor);
    }

    // Toggle Candle Flame
    let candleLit = true;
    function toggleCandle() {
      const flame = document.querySelector("#candleFlame");
      const btn = document.querySelector("#candleToggleBtn");
      if (flame) {
        candleLit = !candleLit;
        flame.setAttribute("visible", candleLit);
        btn.textContent = candleLit ? "🕯️" : "✨";
      }
    }

    // Bakery Contact vCard (.vcf)
    function downloadVCard() {
      const vcardData = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:Indian Bakery Coonoor - Cakes & Pastries",
        "ORG:Indian Bakery Coonoor",
        "TITLE:Bakery & Confectionery",
        "TEL;TYPE=CELL:+919999999999",
        "EMAIL:orders@indianbakerycoonoor.com",
        "URL:https://indianbakerycoonoor.com",
        "NOTE:Specialists in Customized Celebration Cakes, Fresh Pastries & Nilgiri Chocolates",
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", "IndianBakery_Contact.vcf");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function getLatestVideoId() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();
        return (data.files && data.files.length > 0) ? data.files[0].id : null;
      } catch (error) {
        console.error("Drive Fetch Error:", error);
        return null;
      }
    }

    window.addEventListener("load", () => {
      const videoEl = document.querySelector("#driveVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const target = document.querySelector("#target1");
      const toggleButton = document.querySelector("#toggleButton");
      const buttonsContainer = document.querySelector("#planButtons");
      const quickActionBar = document.querySelector("#quickActionBar");
      const flavorPicker = document.querySelector("#flavorPicker");
      const candleBtn = document.querySelector("#candleToggleBtn");
      const saveContactBtn = document.querySelector("#saveContactBtn");
      const curtain = document.querySelector("#blackCurtain");
      const sceneEl = document.querySelector('a-scene');

      let isPlaying = false;

      if (saveContactBtn) saveContactBtn.addEventListener("click", downloadVCard);
      if (candleBtn) candleBtn.addEventListener("click", toggleCandle);

      function dismissCurtain() {
        if (curtain) {
          curtain.style.opacity = "0";
          setTimeout(() => { curtain.style.display = "none"; }, 500);
        }
      }

      sceneEl.addEventListener("arReady", dismissCurtain);
      sceneEl.addEventListener("arError", (err) => {
        console.error("MindAR failed to start:", err);
        dismissCurtain();
      });

      function adjustPlaneToVideoRatio() {
        if (!videoPlane || !videoEl) return;
        const w = videoEl.videoWidth;
        const h = videoEl.videoHeight;

        if (w > 0 && h > 0) {
          const aspectRatio = w / h;
          const targetWidth = aspectRatio >= 1 ? 1 : aspectRatio;
          const targetHeight = aspectRatio >= 1 ? (1 / aspectRatio) : 1;

          videoPlane.setAttribute('geometry', {
            primitive: 'plane',
            width: targetWidth,
            height: targetHeight
          });
        }
      }

      videoEl.addEventListener('loadedmetadata', adjustPlaneToVideoRatio);
      videoEl.addEventListener('playing', () => {
        adjustPlaneToVideoRatio();
        if (videoPlane) videoPlane.setAttribute('visible', 'true');
      });

      target.addEventListener("targetFound", async () => {
        buttonsContainer.style.display = "block";
        if (quickActionBar) quickActionBar.style.display = "flex";
        if (flavorPicker) flavorPicker.style.display = "flex";
        if (candleBtn) candleBtn.style.display = "flex";

        const fileId = await getLatestVideoId();
        if (fileId) {
          const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
          if (videoEl.src !== newSrc) {
            videoEl.src = newSrc;
            videoEl.load();
          }
        }
      });

      target.addEventListener("targetLost", () => {
        buttonsContainer.style.display = "none";
        if (quickActionBar) quickActionBar.style.display = "none";
        if (flavorPicker) flavorPicker.style.display = "none";
        if (candleBtn) candleBtn.style.display = "none";

        videoEl.pause();
        if (videoPlane) videoPlane.setAttribute('visible', 'false');
        isPlaying = false;
        toggleButton.textContent = "▶️ Play Video";
      });

      toggleButton.addEventListener("click", async () => {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            toggleButton.textContent = "⏸ Pause Video";
            isPlaying = true;
          } else {
            videoEl.pause();
            toggleButton.textContent = "▶️ Play Video";
            isPlaying = false;
          }
        } catch (err) {
          console.error("Playback error:", err);
        }
      });
    });
  </script>
</body>
</html>
