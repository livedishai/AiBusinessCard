<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kovai Studio | Spatial AR Experience</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --bg: #0b0711;
      --gold: #D4AF37;
      --gold-bright: #FFE58F;
      --glass: rgba(18, 12, 28, 0.85);
      --glass-border: rgba(212, 175, 55, 0.4);
      --text: #FDFBF7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---------- Loader Curtain ---------- */
    #curtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #1e1130 0%, #06030a 80%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .sparkle-ring {
      width: 60px;
      height: 60px;
      border: 2px dashed var(--gold);
      border-radius: 50%;
      animation: spinRing 6s linear infinite;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    #curtain h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--gold-bright);
    }

    #curtain p {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* ---------- Scan Viewfinder ---------- */
    #scanner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 270px);
      aspect-ratio: 1;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.4s ease;
    }

    #scanner .bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--gold);
    }
    .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    .glow-laser {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      box-shadow: 0 0 12px var(--gold);
      animation: sweep 2.2s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 100% { top: 8%; opacity: 0; }
      50% { top: 90%; opacity: 1; }
    }

    body.tracked #scanner {
      opacity: 0;
    }

    /* ---------- Bottom Control Deck ---------- */
    #deck {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      width: calc(100% - 28px);
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    body.tracked #deck {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* Category Chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      background: linear-gradient(135deg, #7b1fa2, #38006b);
      border-color: var(--gold);
      color: var(--gold-bright);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
    }

    /* Actions Dock */
    .action-dock {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cta-btn {
      flex: 1;
      padding: 13px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8E24AA 0%, #4A148C 100%);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }

    .cta-btn:active { transform: scale(0.96); }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      flex-shrink: 0;
      cursor: pointer;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--gold-bright);
    }

    #photoInput { display: none; }

    #topBadge {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      padding: 7px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      pointer-events: none;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="curtain">
    <div class="sparkle-ring"></div>
    <h1>KOVAI STUDIO</h1>
    <p>Loading AR Magic Experience</p>
  </div>

  <div id="topBadge">KOVAI STUDIO • COONOOR</div>

  <div id="scanner">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
    <div class="glow-laser"></div>
  </div>

  <div id="deck">
    <div class="chips-row">
      <button class="chip-btn active" data-product="mug">☕ Magic Mug</button>
      <button class="chip-btn" data-product="frame">🖼️ Wooden Frame</button>
      <button class="chip-btn" data-product="album">📖 Wedding Album</button>
      <button class="chip-btn" data-product="magnet">🧲 Video Magnet</button>
    </div>

    <div class="action-dock">
      <button class="cta-btn" id="uploadBtn">📸 Try Your Photo</button>
      <input type="file" id="photoInput" accept="image/*" />

      <button class="icon-btn" id="playBtn" title="Play/Pause Video">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <a id="whatsappBtn" href="https://wa.me/?text=Hi%20Kovai%20Studio!%20I%20want%20to%20order%20a%20Customized%20Gift." target="_blank" class="icon-btn" title="Order on WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.53c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.84-.86 2.06s.88 2.39 1 2.56c.12.17 1.74 2.65 4.21 3.72.59.25 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.17-.48-.29"/></svg>
      </a>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <video
        id="arVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        crossorigin="anonymous">
      </video>
      <!-- Visible Default Pattern Texture -->
      <img id="userTexture" src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500&auto=format&fit=crop&q=60" crossorigin="anonymous" />
    </a-assets>

    <!-- Essential Scene Lights -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #FFFFFF; intensity: 1.2" position="1 2 2"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Target Marker Root -->
    <a-entity id="targetRoot" mindar-image-target="targetIndex: 0">
      
      <!-- Center Main Video Screen -->
      <a-plane
        id="videoStage"
        position="0 0 0.02"
        width="1"
        height="1"
        material="src: #arVideo; shader: flat; side: double; transparent: true">
      </a-plane>

      <!-- 3D Gift Orbit Stand (Positioned slightly forward on Z) -->
      <a-entity id="giftStand" position="0.68 0 0.15" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        <!-- Interactive Gift Mesh with Flat Shader -->
        <a-cylinder
          id="giftModel"
          radius="0.2"
          height="0.45"
          material="src: #userTexture; shader: flat; side: double; color: #FFFFFF;">
        </a-cylinder>
        
        <!-- Mug Handle -->
        <a-torus
          id="mugHandle"
          position="0.2 0 0"
          radius="0.1"
          radius-tubular="0.02"
          rotation="0 90 0"
          material="color: #E5C378; shader: flat;">
        </a-torus>
      </a-entity>

      <!-- Floating Gold Halo -->
      <a-ring position="0 0.62 0.05" radius-inner="0.1" radius-outer="0.12" material="color: #FFE58F; shader: flat; opacity: 0.8; transparent: true"></a-ring>
    </a-entity>
  </a-scene>

  <script>
    const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
    const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";

    const products = {
      mug: {
        geometry: "primitive: cylinder; radius: 0.2; height: 0.45;",
        handle: true,
        whatsappText: "Hi Kovai Studio! I want to customize a Magic Mug with my photo."
      },
      frame: {
        geometry: "primitive: box; width: 0.45; height: 0.55; depth: 0.03;",
        handle: false,
        whatsappText: "Hi Kovai Studio! I want to order a customized Wooden Photo Frame."
      },
      album: {
        geometry: "primitive: box; width: 0.58; height: 0.4; depth: 0.06;",
        handle: false,
        whatsappText: "Hi Kovai Studio! I am enquiring about Wedding Albums and shoots."
      },
      magnet: {
        geometry: "primitive: box; width: 0.38; height: 0.38; depth: 0.02;",
        handle: false,
        whatsappText: "Hi Kovai Studio! I want to order AR Video Fridge Magnets."
      }
    };

    async function getLatestVideoId() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();
        return (data.files && data.files.length > 0) ? data.files[0].id : null;
      } catch (err) {
        console.error("Drive Fetch Error:", err);
        return null;
      }
    }

    window.addEventListener("load", () => {
      const videoEl = document.querySelector("#arVideo");
      const videoStage = document.querySelector("#videoStage");
      const target = document.querySelector("#targetRoot");
      const curtain = document.querySelector("#curtain");
      const playBtn = document.querySelector("#playBtn");
      const playIcon = document.querySelector("#playIcon");
      const uploadBtn = document.querySelector("#uploadBtn");
      const photoInput = document.querySelector("#photoInput");
      const giftModel = document.querySelector("#giftModel");
      const mugHandle = document.querySelector("#mugHandle");
      const whatsappBtn = document.querySelector("#whatsappBtn");
      const sceneEl = document.querySelector('a-scene');
      const chipBtns = document.querySelectorAll(".chip-btn");

      let isPlaying = false;
      let currentTextureSrc = "#userTexture";

      sceneEl.addEventListener("arReady", () => {
        curtain.style.opacity = "0";
        setTimeout(() => { curtain.style.display = "none"; }, 600);
      });

      function adjustPlaneToVideoRatio() {
        if (!videoStage || !videoEl) return;
        const w = videoEl.videoWidth;
        const h = videoEl.videoHeight;
        if (w > 0 && h > 0) {
          const ratio = w / h;
          videoStage.setAttribute('geometry', {
            primitive: 'plane',
            width: ratio >= 1 ? 1 : ratio,
            height: ratio >= 1 ? (1 / ratio) : 1
          });
        }
      }

      videoEl.addEventListener('loadedmetadata', adjustPlaneToVideoRatio);
      videoEl.addEventListener('playing', adjustPlaneToVideoRatio);

      target.addEventListener("targetFound", async () => {
        document.body.classList.add("tracked");
        const fileId = await getLatestVideoId();
        if (fileId) {
          const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
          if (videoEl.src !== newSrc) {
            videoEl.src = newSrc;
            videoEl.load();
          }
        }
      });

      target.addEventListener("targetLost", () => {
        document.body.classList.remove("tracked");
        videoEl.pause();
        isPlaying = false;
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      });

      playBtn.addEventListener("click", async () => {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            isPlaying = true;
          } else {
            videoEl.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            isPlaying = false;
          }
        } catch (err) {
          console.error("Playback error:", err);
        }
      });

      // Product switcher
      chipBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          chipBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          const prod = products[btn.dataset.product];
          giftModel.setAttribute('geometry', prod.geometry);
          giftModel.setAttribute('material', {
            src: currentTextureSrc,
            shader: 'flat',
            side: 'double',
            color: '#FFFFFF'
          });

          mugHandle.setAttribute('visible', prod.handle ? 'true' : 'false');
          whatsappBtn.href = `https://wa.me/?text=${encodeURIComponent(prod.whatsappText)}`;
        });
      });

      // User photo upload
      uploadBtn.addEventListener("click", () => photoInput.click());

      photoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            currentTextureSrc = evt.target.result;
            giftModel.setAttribute('material', {
              src: evt.target.result,
              shader: 'flat',
              side: 'double',
              color: '#FFFFFF'
            });
            uploadBtn.textContent = "✨ Photo Applied!";
          };
          reader.readAsDataURL(file);
        }
      });
    });
  </script>
</body>
</html>
