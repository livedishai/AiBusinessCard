<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JEWELS-AI | Holographic 3D Stage & Carousel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --deep: #0e0717;
      --gold: #D4AF37;
      --gold-soft: #F0D687;
      --cream: #F5EFE6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--deep);
      overflow: hidden;
      font-family: 'Manrope', sans-serif;
      color: var(--cream);
      -webkit-tap-highlight-color: transparent;
    }

    #blackCurtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #1f0d33 0%, var(--deep) 70%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .gem-loader {
      width: 52px;
      height: 52px;
      animation: gemSpin 2.6s ease-in-out infinite;
    }

    .gem-loader path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(212,175,55,0.6));
    }

    @keyframes gemSpin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    #loader {
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--cream);
      text-align: center;
    }

    #loader span {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-top: 6px;
    }

    #scanHint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 400;
      width: min(64vw, 260px);
      aspect-ratio: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #scanHint .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--gold);
      opacity: 0.85;
    }
    #scanHint .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
    #scanHint .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
    #scanHint .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
    #scanHint .br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

    #scanHint .scanline {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 8px var(--gold);
      animation: scanMove 2.2s ease-in-out infinite;
    }

    @keyframes scanMove {
      0%   { top: 6%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 92%; opacity: 0; }
    }

    #scanHint p {
      position: absolute;
      bottom: -32px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(245, 239, 230, 0.65);
    }

    body.found #scanHint {
      opacity: 0;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="blackCurtain">
    <svg class="gem-loader" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 4 L48 20 L28 52 L8 20 Z M8 20 L48 20 M18 20 L28 4 L38 20 M18 20 L28 52 M38 20 L28 52" />
    </svg>
    <div id="loader">JEWELS·AI<span>Initializing Hologram</span></div>
  </div>

  <div id="scanHint">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanline"></div>
    <p>Scan AR Business Card</p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <video id="driveVideo" playsinline webkit-playsinline preload="auto" loop crossorigin="anonymous"></video>
      <img id="itemImg1" src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=300" crossorigin="anonymous">
      <img id="itemImg2" src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=300" crossorigin="anonymous">
      <img id="itemImg3" src="https://images.unsplash.com/photo-1611591475824-7890f576e107?w=300" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable;"></a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      
      <a-entity id="screenGroup" position="0 0.44 0.22" rotation="-12 0 0">
        <a-plane width="1.08" height="0.68" position="0 0 -0.01" material="color: #ffffff; opacity: 0.2; transparent: true; roughness: 0.1;"></a-plane>
        
        <a-plane id="videoPlane" class="clickable" width="1.02" height="0.62" material="src: #driveVideo; side: double; transparent: true;"></a-plane>

        <a-entity id="playOverlay" class="clickable" position="0 0 0.03">
          <a-circle radius="0.14" material="color: #ffffff; opacity: 0.45; transparent: true"></a-circle>
          <a-triangle vertex-a="0.06 0 0.01" vertex-b="-0.04 0.06 0.01" vertex-c="-0.04 -0.06 0.01" material="color: #ffffff; side: double"></a-triangle>
        </a-entity>
      </a-entity>

      <a-entity id="catalogueStage" position="0 0.02 0.12" visible="false">
        
        <a-ring radius-inner="0.48" radius-outer="0.52" position="0 -0.15 0" rotation="-65 0 0" material="color: #ffffff; opacity: 0.55; transparent: true; side: double"></a-ring>
        <a-ring radius-inner="0.38" radius-outer="0.40" position="0 -0.15 0.02" rotation="-65 0 0" material="color: #D4AF37; opacity: 0.45; transparent: true; side: double"></a-ring>

        <a-entity id="prodLeft" class="clickable" position="-0.38 -0.04 0.04" rotation="0 18 0">
          <a-plane width="0.26" height="0.32" material="src: #itemImg1; transparent: true; opacity: 0.92;"></a-plane>
          <a-plane width="0.28" height="0.34" position="0 0 -0.01" material="color: #ffffff; opacity: 0.25; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="prodCenter" class="clickable" position="0 0.02 0.12">
          <a-plane width="0.32" height="0.38" material="src: #itemImg2; transparent: true; opacity: 0.98;"></a-plane>
          <a-plane width="0.34" height="0.40" position="0 0 -0.01" material="color: #D4AF37; opacity: 0.45; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="prodRight" class="clickable" position="0.38 -0.04 0.04" rotation="0 -18 0">
          <a-plane width="0.26" height="0.32" material="src: #itemImg3; transparent: true; opacity: 0.92;"></a-plane>
          <a-plane width="0.28" height="0.34" position="0 0 -0.01" material="color: #ffffff; opacity: 0.25; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="catalogueLabel" position="0 -0.22 0.06">
          <a-plane width="0.75" height="0.12" material="color: #000000; opacity: 0.45; transparent: true">
            <a-text id="labelText" value="Kundan Pearl Set • $178" align="center" color="#F0D687" width="1.6"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <a-entity position="0 -0.42 0.24" rotation="-12 0 0">
        
        <a-entity id="btnConnect" class="clickable" position="-0.32 0 0">
          <a-plane width="0.54" height="0.18" material="color: #ffffff; opacity: 0.28; transparent: true; roughness: 0.1"></a-plane>
          <a-plane width="0.56" height="0.20" position="0 0 -0.01" material="color: #ffffff; opacity: 0.15; transparent: true"></a-plane>
          <a-text value="CONNECT" align="center" color="#ffffff" width="1.9" position="0 0 0.01"></a-text>
        </a-entity>

        <a-entity id="btnCatalogue" class="clickable" position="0.32 0 0">
          <a-plane id="catBg" width="0.54" height="0.18" material="color: #ffffff; opacity: 0.28; transparent: true; roughness: 0.1"></a-plane>
          <a-plane width="0.56" height="0.20" position="0 0 -0.01" material="color: #ffffff; opacity: 0.15; transparent: true"></a-plane>
          <a-text value="CATALOGUE" align="center" color="#ffffff" width="1.9" position="0 0 0.01"></a-text>
        </a-entity>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
    const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";
    const WHATSAPP_CONTACT = "919999999999"; 

    const ITEMS = [
      { name: "Antique Filigree Kada", price: "$98" },
      { name: "Kundan Pearl Haram", price: "$178" },
      { name: "Emerald Temple Set", price: "$145" }
    ];

    async function getLatestVideoId() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();
        return (data.files && data.files.length > 0) ? data.files[0].id : null;
      } catch (error) {
        console.error("Drive Fetch Error:", error);
        return null;
      }
    }

    window.addEventListener("load", () => {
      const videoEl = document.querySelector("#driveVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const playOverlay = document.querySelector("#playOverlay");
      const target = document.querySelector("#target1");
      const curtain = document.querySelector("#blackCurtain");
      const sceneEl = document.querySelector('a-scene');

      const btnConnect = document.querySelector("#btnConnect");
      const btnCatalogue = document.querySelector("#btnCatalogue");
      const catBg = document.querySelector("#catBg");
      const catalogueStage = document.querySelector("#catalogueStage");
      const labelText = document.querySelector("#labelText");

      const prodLeft = document.querySelector("#prodLeft");
      const prodCenter = document.querySelector("#prodCenter");
      const prodRight = document.querySelector("#prodRight");

      let isPlaying = false;
      let isCatalogueOpen = false;

      // Tap video or center play overlay to play/pause
      async function toggleVideo() {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            playOverlay.setAttribute("visible", "false");
            isPlaying = true;
          } else {
            videoEl.pause();
            playOverlay.setAttribute("visible", "true");
            isPlaying = false;
          }
        } catch (err) {
          console.error("Video Playback Error:", err);
        }
      }

      playOverlay.addEventListener("click", toggleVideo);
      videoPlane.addEventListener("click", toggleVideo);

      // Tap CATALOGUE button to toggle 3D floating stage
      btnCatalogue.addEventListener("click", () => {
        isCatalogueOpen = !isCatalogueOpen;
        catalogueStage.setAttribute("visible", isCatalogueOpen);
        
        // Highlight button when active
        if (isCatalogueOpen) {
          catBg.setAttribute("material", "color: #D4AF37; opacity: 0.55; transparent: true;");
        } else {
          catBg.setAttribute("material", "color: #ffffff; opacity: 0.28; transparent: true;");
        }
      });

      // Tap floating items to inspect name & price
      prodLeft.addEventListener("click", () => {
        labelText.setAttribute("value", `${ITEMS[0].name} • ${ITEMS[0].price}`);
      });

      prodCenter.addEventListener("click", () => {
        labelText.setAttribute("value", `${ITEMS[1].name} • ${ITEMS[1].price}`);
      });

      prodRight.addEventListener("click", () => {
        labelText.setAttribute("value", `${ITEMS[2].name} • ${ITEMS[2].price}`);
      });

      // Tap CONNECT button to trigger WhatsApp
      btnConnect.addEventListener("click", () => {
        window.open(`https://wa.me/${WHATSAPP_CONTACT}?text=Hi,%20I%20am%20viewing%20your%20AR%20card%20and%20want%20to%20know%20more!`, "_blank");
      });

      function dismissCurtain() {
        if (curtain) {
          curtain.style.opacity = "0";
          setTimeout(() => { curtain.style.display = "none"; }, 600);
        }
      }

      sceneEl.addEventListener("arReady", dismissCurtain);
      sceneEl.addEventListener("arError", dismissCurtain);

      target.addEventListener("targetFound", async () => {
        document.body.classList.add("found");
        const fileId = await getLatestVideoId();
        if (fileId) {
          const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
          if (videoEl.src !== newSrc) {
            videoEl.src = newSrc;
            videoEl.load();
          }
        }
      });

      target.addEventListener("targetLost", () => {
        document.body.classList.remove("found");
        videoEl.pause();
        playOverlay.setAttribute("visible", "true");
        isPlaying = false;
      });
    });
  </script>
</body>
</html>
