<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JEWELS-AI | Live Drive AR</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* RESET & BASE STYLES */
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* THE BLACK CURTAIN */
    #blackCurtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    /* CUSTOM LOADER */
    #loader {
      color: white;
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* BUTTON PANEL STYLES */
    .button-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
    }

    .plan-button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #5E0F8B 0%, #3e0a5c 100%);
      color: #fff;
      cursor: pointer;
      min-width: 180px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }

    .plan-button:active {
      transform: scale(0.95);
    }

    /* INSTAGRAM BUTTON */
    #instagramButton {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      z-index: 100000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, opacity 0.2s ease;
      text-decoration: none;
    }

    #instagramButton img {
      width: 35px;
      height: 35px;
    }

    #instagramButton:hover {
      transform: scale(1.1);
    }

    #instagramButton:active {
      transform: scale(0.95);
    }

    /* FORCE-HIDE ANY STRAY MINDAR UI */
    [class^="mindar-ui"],
    [id^="mindar-ui"],
    .mindar-ui-overlay {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* SCENE & CANVAS RESET */
    a-scene, .a-canvas {
      background-color: #000 !important;
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="blackCurtain">
    <div id="loader">Initializing AI Engine...</div>
  </div>

  <!-- Instagram Floating Link -->
  <a href="https://www.instagram.com/overlay_gifts_ai/" target="_blank" id="instagramButton">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
  </a>

  <!-- AR Action Controls -->
  <div class="button-panel" id="planButtons">
    <button class="plan-button" id="toggleButton">▶️ Play Video</button>
  </div>

  <!-- A-Frame AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <video
        id="driveVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      <a-plane
        id="videoPlane"
        width="1"
        height="1"
        visible="false"
        material="src: #driveVideo; side: double; transparent: true">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    /* ===============================
       CONFIGURATION
    ================================ */
    const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
    const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";

    /* ===============================
       OPTIMIZED CHROMA KEY SHADER
    ================================ */
    AFRAME.registerShader('chromakey', {
      schema: {
        src: { type: 'map' },
        color: { type: 'color', default: '#00FF00' },
        threshold: { type: 'number', default: 0.3 },
        smoothness: { type: 'number', default: 0.05 }
      },

      init: function (data) {
        const videoTexture = new THREE.VideoTexture(data.src);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.generateMipmaps = false;
        videoTexture.format = THREE.RGBAFormat;

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            tex: { value: videoTexture },
            keyColor: { value: new THREE.Color(data.color) },
            similarity: { value: data.threshold },
            smoothness: { value: data.smoothness }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tex;
            uniform vec3 keyColor;
            uniform float similarity;
            uniform float smoothness;
            varying vec2 vUv;
            void main() {
              vec4 videoColor = texture2D(tex, vUv);
              float diff = distance(videoColor.rgb, keyColor);
              float alpha = smoothstep(similarity, similarity + smoothness, diff);
              if (alpha < 0.1) discard;
              gl_FragColor = vec4(videoColor.rgb, alpha);
            }
          `,
          transparent: true
        });
      },

      update: function (data) {
        this.material.uniforms.similarity.value = data.threshold;
        this.material.uniforms.smoothness.value = data.smoothness;
        this.material.uniforms.keyColor.value = new THREE.Color(data.color);
      }
    });

    /* ===============================
       FRESH DRIVE FETCH (NO CACHE)
    ================================ */
    async function getLatestVideoId() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.files && data.files.length > 0) {
          return data.files[0].id;
        }
        return null;
      } catch (error) {
        console.error("Drive Fetch Error:", error);
        return null;
      }
    }

    /* ===============================
       AR INTERACTION LOGIC
    ================================ */
    window.addEventListener("load", async () => {
      const videoEl = document.querySelector("#driveVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const target = document.querySelector("#target1");
      const toggleButton = document.querySelector("#toggleButton");
      const buttonsContainer = document.querySelector("#planButtons");
      const curtain = document.querySelector("#blackCurtain");
      const sceneEl = document.querySelector('a-scene');

      let isPlaying = false;

      // Cleanup stray MindAR UI elements
      const uiKiller = setInterval(() => {
        const uiElements = document.querySelectorAll('[class^="mindar-ui"], [id^="mindar-ui"]');
        uiElements.forEach(el => el.remove());
      }, 100);

      // Dynamic Aspect Ratio Calculation
      function adjustPlaneToVideoRatio() {
        if (!videoPlane || !videoEl) return;

        const w = videoEl.videoWidth;
        const h = videoEl.videoHeight;

        if (w > 0 && h > 0) {
          const aspectRatio = w / h;
          let targetWidth, targetHeight;

          if (aspectRatio >= 1) {
            targetWidth = 1;
            targetHeight = 1 / aspectRatio;
          } else {
            targetWidth = aspectRatio;
            targetHeight = 1;
          }

          videoPlane.setAttribute('geometry', {
            primitive: 'plane',
            width: targetWidth,
            height: targetHeight
          });

          const mesh = videoPlane.getObject3D('mesh');
          if (mesh && mesh.geometry) {
            mesh.geometry.dispose();
            mesh.geometry = new THREE.PlaneGeometry(targetWidth, targetHeight);
          }
        }
      }

      // Metadata & play listeners
      videoEl.addEventListener('loadedmetadata', adjustPlaneToVideoRatio);
      videoEl.addEventListener('canplay', adjustPlaneToVideoRatio);
      videoEl.addEventListener('playing', () => {
        adjustPlaneToVideoRatio();
        if (videoPlane) videoPlane.setAttribute('visible', 'true');
      });

      // Scene Ready
      sceneEl.addEventListener("arReady", () => {
        if (curtain) {
          curtain.style.opacity = "0";
          setTimeout(() => {
            curtain.style.display = "none";
            clearInterval(uiKiller);
          }, 500);
        }
      });

      // Marker Tracking Events
      target.addEventListener("targetFound", async () => {
        buttonsContainer.style.display = "block";

        const fileId = await getLatestVideoId();
        if (fileId) {
          const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
          if (videoEl.src !== newSrc) {
            videoEl.src = newSrc;
            videoEl.load();
          }
        }
      });

      target.addEventListener("targetLost", () => {
        buttonsContainer.style.display = "none";
        videoEl.pause();
        if (videoPlane) videoPlane.setAttribute('visible', 'false');
        isPlaying = false;
        toggleButton.textContent = "▶️ Play Video";
      });

      // Play/Pause Button
      toggleButton.addEventListener("click", async () => {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            toggleButton.textContent = "⏸ Pause Video";
            isPlaying = true;
          } else {
            videoEl.pause();
            toggleButton.textContent = "▶️ Play Video";
            isPlaying = false;
          }
        } catch (err) {
          console.error("Playback error:", err);
        }
      });
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
