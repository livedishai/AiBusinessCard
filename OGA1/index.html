<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KOVAI STUDIO | AR Interactive Experience</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --bg-dark: #0f0c15;
      --gold-accent: #E5C378;
      --gold-bright: #F7E7A9;
      --gold-glow: rgba(229, 195, 120, 0.4);
      --glass-surface: rgba(18, 14, 26, 0.75);
      --glass-border: rgba(229, 195, 120, 0.3);
      --text-main: #FAF7F2;
      --text-sub: rgba(250, 247, 242, 0.7);
      --accent-gradient: linear-gradient(135deg, #7A1FA2 0%, #38006b 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-dark);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---------- Loading Screen ---------- */
    #blackCurtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #201335 0%, var(--bg-dark) 75%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .loader-ring {
      width: 52px;
      height: 52px;
      border: 2px solid rgba(229, 195, 120, 0.15);
      border-top-color: var(--gold-accent);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loaderText {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-align: center;
    }

    #loaderText span {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* ---------- Brand Header ---------- */
    #brandHeader {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    #brandHeader .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-accent);
      box-shadow: 0 0 8px var(--gold-accent);
    }

    /* ---------- Viewfinder Overlay ---------- */
    #scanHint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 400;
      width: min(68vw, 280px);
      aspect-ratio: 1;
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    #scanHint .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--gold-accent);
    }
    #scanHint .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    #scanHint .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    #scanHint .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    #scanHint .br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    #scanHint .scanline {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
      box-shadow: 0 0 10px var(--gold-accent);
      animation: scanSweep 2.4s ease-in-out infinite;
    }

    @keyframes scanSweep {
      0%   { top: 5%; opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { top: 95%; opacity: 0; }
    }

    #scanHint p {
      position: absolute;
      bottom: -38px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-sub);
    }

    body.found #scanHint {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
    }

    /* ---------- Interactive Spatial Hub (Active on Target Found) ---------- */
    .ar-controls {
      position: fixed;
      inset: 0;
      z-index: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body.found .ar-controls {
      opacity: 1;
      pointer-events: auto;
    }

    /* Left Flank: Gifting Category Shortcuts */
    .flank-left {
      position: absolute;
      left: 16px;
      top: 48%;
      transform: translateY(-50%) translateX(-20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.found .flank-left {
      transform: translateY(-50%) translateX(0);
    }

    /* Right Flank: Studio & Social Badges */
    .flank-right {
      position: absolute;
      right: 16px;
      top: 48%;
      transform: translateY(-50%) translateX(20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.found .flank-right {
      transform: translateY(-50%) translateX(0);
    }

    .pill-btn {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .pill-btn:active {
      transform: scale(0.94);
      border-color: var(--gold-accent);
    }

    .pill-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--gold-accent);
      flex-shrink: 0;
    }

    /* Bottom Action Dock: Video Playback & Quick Contact */
    .bottom-dock {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      align-items: center;
      gap: 10px;
      width: calc(100% - 32px);
      max-width: 420px;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.found .bottom-dock {
      transform: translateX(-50%) translateY(0);
    }

    .btn-play {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      background: var(--accent-gradient);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    .icon-action-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease;
    }

    .icon-action-btn:active {
      transform: scale(0.92);
    }

    .icon-action-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--gold-accent);
    }

    /* A-Frame / MindAR UI resets */
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }
  </style>
</head>

<body>

    <!-- Bottom Action Dock -->

  <!-- A-Frame AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <video
        id="driveVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Card Target Plane -->
    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      <a-plane
        id="videoPlane"
        width="1"
        height="1"
        visible="false"
        material="src: #driveVideo; side: double; transparent: true">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
    const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";

    async function getLatestVideoId() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();
        return (data.files && data.files.length > 0) ? data.files[0].id : null;
      } catch (error) {
        console.error("Drive Fetch Error:", error);
        return null;
      }
    }

    window.addEventListener("load", () => {
      const videoEl = document.querySelector("#driveVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const target = document.querySelector("#target1");
      const toggleButton = document.querySelector("#toggleButton");
      const curtain = document.querySelector("#blackCurtain");
      const sceneEl = document.querySelector('a-scene');

      let isPlaying = false;

      function dismissCurtain() {
        if (curtain) {
          curtain.style.opacity = "0";
          setTimeout(() => { curtain.style.display = "none"; }, 600);
        }
      }

      sceneEl.addEventListener("arReady", dismissCurtain);
      sceneEl.addEventListener("arError", (err) => {
        console.error("MindAR failed to start:", err);
        dismissCurtain();
      });

      function adjustPlaneToVideoRatio() {
        if (!videoPlane || !videoEl) return;
        const w = videoEl.videoWidth;
        const h = videoEl.videoHeight;

        if (w > 0 && h > 0) {
          const aspectRatio = w / h;
          const targetWidth = aspectRatio >= 1 ? 1 : aspectRatio;
          const targetHeight = aspectRatio >= 1 ? (1 / aspectRatio) : 1;

          videoPlane.setAttribute('geometry', {
            primitive: 'plane',
            width: targetWidth,
            height: targetHeight
          });
        }
      }

      videoEl.addEventListener('loadedmetadata', adjustPlaneToVideoRatio);
      videoEl.addEventListener('playing', () => {
        adjustPlaneToVideoRatio();
        if (videoPlane) videoPlane.setAttribute('visible', 'true');
      });

      target.addEventListener("targetFound", async () => {
        document.body.classList.add("found");
        const fileId = await getLatestVideoId();
        if (fileId) {
          const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
          if (videoEl.src !== newSrc) {
            videoEl.src = newSrc;
            videoEl.load();
          }
        }
      });

      target.addEventListener("targetLost", () => {
        document.body.classList.remove("found");
        videoEl.pause();
        if (videoPlane) videoPlane.setAttribute('visible', 'false');
        isPlaying = false;
        toggleButton.textContent = "▶ Play Video";
      });

      toggleButton.addEventListener("click", async () => {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            toggleButton.textContent = "⏸ Pause Video";
            isPlaying = true;
          } else {
            videoEl.pause();
            toggleButton.textContent = "▶ Play Video";
            isPlaying = false;
          }
        } catch (err) {
          console.error("Playback error:", err);
        }
      });
    });
  </script>
</body>
</html>
