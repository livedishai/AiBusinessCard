<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JEWELS-AI | Live Interactive Holographic Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --deep: #0e0717;
      --gold: #D4AF37;
      --gold-soft: #F0D687;
      --cream: #F5EFE6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--deep);
      overflow: hidden;
      font-family: 'Manrope', sans-serif;
      color: var(--cream);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---------- Loading Screen ---------- */
    #blackCurtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #1f0d33 0%, var(--deep) 70%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .gem-loader {
      width: 52px;
      height: 52px;
      animation: gemSpin 2.6s ease-in-out infinite;
    }

    .gem-loader path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(212,175,55,0.6));
    }

    @keyframes gemSpin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    #loader {
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--cream);
      text-align: center;
    }

    #loader span {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-top: 6px;
    }

    /* ---------- Scan Hint ---------- */
    #scanHint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 400;
      width: min(64vw, 260px);
      aspect-ratio: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #scanHint .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--gold);
      opacity: 0.85;
    }
    #scanHint .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
    #scanHint .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
    #scanHint .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
    #scanHint .br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

    #scanHint .scanline {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 8px var(--gold);
      animation: scanMove 2.2s ease-in-out infinite;
    }

    @keyframes scanMove {
      0%   { top: 6%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 92%; opacity: 0; }
    }

    #scanHint p {
      position: absolute;
      bottom: -32px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(245, 239, 230, 0.65);
    }

    body.found #scanHint {
      opacity: 0;
    }

    /* Floating feedback toast */
    #statusToast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      padding: 8px 18px;
      background: rgba(19, 8, 33, 0.88);
      border: 1px solid var(--gold-soft);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--gold-soft);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      pointer-events: none;
    }

    #statusToast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="blackCurtain">
    <svg class="gem-loader" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 4 L48 20 L28 52 L8 20 Z M8 20 L48 20 M18 20 L28 52 M38 20 L28 52" />
    </svg>
    <div id="loader">JEWELS·AI<span>Loading Hologram</span></div>
  </div>

  <div id="scanHint">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanline"></div>
    <p>Scan AR Target Card</p>
  </div>

  <div id="statusToast">Target Recognized</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <video
        id="dummyVideo"
        src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        crossorigin="anonymous">
      </video>

      <img id="dummyImg1" src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400" crossorigin="anonymous">
      <img id="dummyImg2" src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400" crossorigin="anonymous">
      <img id="dummyImg3" src="https://images.unsplash.com/photo-1611591475824-7890f576e107?w=400" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable;"></a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0">

      <a-entity id="screenGroup" position="0 0.44 0.22" rotation="-12 0 0">
        <a-plane width="1.08" height="0.68" position="0 0 -0.01" material="color: #ffffff; opacity: 0.2; transparent: true; roughness: 0.1;"></a-plane>
        
        <a-plane id="videoPlane" class="clickable" width="1.02" height="0.62" material="src: #dummyVideo; side: double; transparent: true;"></a-plane>

        <a-entity id="playOverlay" class="clickable" position="0 0 0.03">
          <a-circle radius="0.14" material="color: #ffffff; opacity: 0.45; transparent: true"></a-circle>
          <a-triangle id="playIcon" vertex-a="0.06 0 0.01" vertex-b="-0.04 0.06 0.01" vertex-c="-0.04 -0.06 0.01" material="color: #ffffff; side: double"></a-triangle>
        </a-entity>
      </a-entity>

      <a-entity id="catalogueStage" position="0 0.02 0.12" visible="false">
        
        <a-ring radius-inner="0.48" radius-outer="0.52" position="0 -0.15 0" rotation="-65 0 0" material="color: #ffffff; opacity: 0.55; transparent: true; side: double"></a-ring>
        <a-ring radius-inner="0.38" radius-outer="0.40" position="0 -0.15 0.02" rotation="-65 0 0" material="color: #D4AF37; opacity: 0.45; transparent: true; side: double"></a-ring>

        <a-entity id="itemLeft" class="clickable" position="-0.38 -0.04 0.04" rotation="0 18 0">
          <a-plane width="0.26" height="0.32" material="src: #dummyImg1; transparent: true; opacity: 0.95;"></a-plane>
          <a-plane width="0.28" height="0.34" position="0 0 -0.01" material="color: #ffffff; opacity: 0.25; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="itemCenter" class="clickable" position="0 0.02 0.12">
          <a-plane width="0.32" height="0.38" material="src: #dummyImg2; transparent: true; opacity: 0.98;"></a-plane>
          <a-plane width="0.34" height="0.40" position="0 0 -0.01" material="color: #D4AF37; opacity: 0.5; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="itemRight" class="clickable" position="0.38 -0.04 0.04" rotation="0 -18 0">
          <a-plane width="0.26" height="0.32" material="src: #dummyImg3; transparent: true; opacity: 0.95;"></a-plane>
          <a-plane width="0.28" height="0.34" position="0 0 -0.01" material="color: #ffffff; opacity: 0.25; transparent: true;"></a-plane>
        </a-entity>

        <a-entity id="catalogueLabel" position="0 -0.22 0.06">
          <a-plane width="0.8" height="0.13" material="color: #0e0717; opacity: 0.75; transparent: true">
            <a-text id="labelText" value="Kundan Pearl Haram • $178" align="center" color="#F0D687" width="1.7"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <a-entity position="0 -0.42 0.24" rotation="-12 0 0">
        
        <a-entity id="btnConnect" class="clickable" position="-0.32 0 0">
          <a-plane id="btnConnectBg" width="0.54" height="0.18" material="color: #ffffff; opacity: 0.32; transparent: true; roughness: 0.1"></a-plane>
          <a-plane width="0.56" height="0.20" position="0 0 -0.01" material="color: #ffffff; opacity: 0.15; transparent: true"></a-plane>
          <a-text value="CONNECT" align="center" color="#ffffff" width="1.9" position="0 0 0.01"></a-text>
        </a-entity>

        <a-entity id="btnCatalogue" class="clickable" position="0.32 0 0">
          <a-plane id="btnCatBg" width="0.54" height="0.18" material="color: #ffffff; opacity: 0.32; transparent: true; roughness: 0.1"></a-plane>
          <a-plane width="0.56" height="0.20" position="0 0 -0.01" material="color: #ffffff; opacity: 0.15; transparent: true"></a-plane>
          <a-text value="CATALOGUE" align="center" color="#ffffff" width="1.9" position="0 0 0.01"></a-text>
        </a-entity>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    // Mock Catalog Details
    const CATALOG_ITEMS = [
      { id: "itemLeft", name: "Royal Bridal Choker", price: "$145" },
      { id: "itemCenter", name: "Kundan Pearl Haram", price: "$178" },
      { id: "itemRight", name: "Antique Filigree Kada", price: "$98" }
    ];

    const WHATSAPP_CONTACT = "919999999999"; 

    window.addEventListener("load", () => {
      const videoEl = document.querySelector("#dummyVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const playOverlay = document.querySelector("#playOverlay");
      const target = document.querySelector("#target1");
      const curtain = document.querySelector("#blackCurtain");
      const sceneEl = document.querySelector("a-scene");
      const toast = document.querySelector("#statusToast");

      const btnConnect = document.querySelector("#btnConnect");
      const btnCatalogue = document.querySelector("#btnCatalogue");
      const btnCatBg = document.querySelector("#btnCatBg");
      const btnConnectBg = document.querySelector("#btnConnectBg");
      const catalogueStage = document.querySelector("#catalogueStage");
      const labelText = document.querySelector("#labelText");

      let isPlaying = false;
      let isCatalogueOpen = false;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2200);
      }

      // 1. Play / Pause Control
      async function toggleVideo() {
        try {
          if (!isPlaying) {
            videoEl.muted = false;
            await videoEl.play();
            playOverlay.setAttribute("visible", "false");
            isPlaying = true;
            showToast("Playing Video");
          } else {
            videoEl.pause();
            playOverlay.setAttribute("visible", "true");
            isPlaying = false;
            showToast("Video Paused");
          }
        } catch (err) {
          // Auto-fallback for mobile autoplay policies (muted play)
          console.warn("Autoplay with sound blocked. Retrying muted:", err);
          videoEl.muted = true;
          await videoEl.play();
          playOverlay.setAttribute("visible", "false");
          isPlaying = true;
          showToast("Playing Muted (Tap to Unmute)");
        }
      }

      playOverlay.addEventListener("click", toggleVideo);
      videoPlane.addEventListener("click", toggleVideo);

      // 2. Toggle Floating 3D Catalogue
      btnCatalogue.addEventListener("click", () => {
        isCatalogueOpen = !isCatalogueOpen;
        catalogueStage.setAttribute("visible", isCatalogueOpen);

        // Visual state toggle on button
        if (isCatalogueOpen) {
          btnCatBg.setAttribute("material", "color: #D4AF37; opacity: 0.65; transparent: true;");
          showToast("Catalogue Displayed");
        } else {
          btnCatBg.setAttribute("material", "color: #ffffff; opacity: 0.32; transparent: true;");
          showToast("Catalogue Hidden");
        }
      });

      // 3. Connect (WhatsApp) Action
      btnConnect.addEventListener("click", () => {
        btnConnectBg.setAttribute("material", "color: #25D366; opacity: 0.65; transparent: true;");
        setTimeout(() => {
          btnConnectBg.setAttribute("material", "color: #ffffff; opacity: 0.32; transparent: true;");
        }, 400);

        showToast("Connecting to WhatsApp...");
        window.open(`https://wa.me/${WHATSAPP_CONTACT}?text=Hi!%20I%20am%20exploring%20your%20Live%20AR%20Jewelry%20Card%20and%20would%20like%20more%20information.`, "_blank");
      });

      // 4. Product inspection on carousel tap
      CATALOG_ITEMS.forEach(item => {
        const entity = document.querySelector(`#${item.id}`);
        entity.addEventListener("click", () => {
          labelText.setAttribute("value", `${item.name} • ${item.price}`);
          
          // Subtle pulse animation on tap
          entity.setAttribute("animation__pulse", {
            property: "scale",
            to: "1.15 1.15 1.15",
            dur: 150,
            dir: "alternate",
            loop: 1
          });
          showToast(`Selected: ${item.name}`);
        });
      });

      // AR Scene lifecycle
      function dismissCurtain() {
        if (curtain) {
          curtain.style.opacity = "0";
          setTimeout(() => { curtain.style.display = "none"; }, 600);
        }
      }

      sceneEl.addEventListener("arReady", dismissCurtain);
      sceneEl.addEventListener("arError", dismissCurtain);

      target.addEventListener("targetFound", () => {
        document.body.classList.add("found");
        showToast("Card Recognized");
      });

      target.addEventListener("targetLost", () => {
        document.body.classList.remove("found");
        videoEl.pause();
        playOverlay.setAttribute("visible", "true");
        isPlaying = false;
      });
    });
  </script>
</body>
</html>
