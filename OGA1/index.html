<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JEWELS-AI | Live Drive AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #blackCurtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    #loader {
      color: white;
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .button-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
    }

    .plan-button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #5E0F8B 0%, #3e0a5c 100%);
      color: #fff;
      cursor: pointer;
      min-width: 180px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }

    .plan-button:active {
      transform: scale(0.95);
    }

    #instagramButton {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none;
    }

    #instagramButton img {
      width: 35px;
      height: 35px;
    }

    #instagramButton:hover {
      transform: scale(1.1);
    }

    #instagramButton:active {
      transform: scale(0.95);
    }

    [class^="mindar-ui"],
    [id^="mindar-ui"],
    .mindar-ui-overlay {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    a-scene, .a-canvas {
      background-color: #000 !important;
    }
  </style>
</head>

<body>

<div id="blackCurtain">
  <div id="loader">Initializing AI Engine...</div>
</div>

<a href="https://www.instagram.com/overlay_gifts_ai/" target="_blank" id="instagramButton">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
</a>

<div class="button-panel" id="planButtons">
  <button class="plan-button" id="toggleButton">▶️ Play Video</button>
</div>

<a-scene 
  mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; alpha: true">

  <a-assets>
    <video
      id="driveVideo"
      playsinline
      webkit-playsinline
      preload="auto"
      loop
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target1" mindar-image-target="targetIndex: 0">
    <a-plane
      id="videoPlane"
      width="1"
      height="1"
      visible="false"
      material="src: #driveVideo; side: double; transparent: true">
    </a-plane>
  </a-entity>

</a-scene>

<script>
const API_KEY = "AIzaSyA_mBu6emRKASkqHpLtwkdBiCQKYO3rvcw"; 
const FOLDER_ID = "1jRyVReP4cq7yk1VqwdFCMt0w4on4S77Q";

async function getLatestVideoId() {
  try {
    const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'video/'&orderBy=modifiedTime desc&pageSize=1&fields=files(id)&key=${API_KEY}`;
    const response = await fetch(url);
    const data = await response.json();
    if (data.files && data.files.length > 0) {
      return data.files[0].id; 
    }
    return null;
  } catch (error) {
    console.error("Drive Fetch Error:", error);
    return null;
  }
}

window.addEventListener("load", () => {
  const videoEl = document.querySelector("#driveVideo");
  const videoPlane = document.querySelector("#videoPlane");
  const target = document.querySelector("#target1");
  const toggleButton = document.querySelector("#toggleButton");
  const buttonsContainer = document.querySelector("#planButtons");
  const curtain = document.querySelector("#blackCurtain"); 
  const sceneEl = document.querySelector('a-scene');

  let isPlaying = false;

  const uiKiller = setInterval(() => {
    const uiElements = document.querySelectorAll('[class^="mindar-ui"], [id^="mindar-ui"]');
    uiElements.forEach(el => el.remove());
  }, 100);

  // Dynamically update the 3D plane dimensions to match exact video aspect ratio
  function adjustPlaneAspectRatio() {
    if (!videoPlane || !videoEl.videoWidth || !videoEl.videoHeight) return;

    const w = videoEl.videoWidth;
    const h = videoEl.videoHeight;
    const aspectRatio = w / h;

    if (aspectRatio >= 1) {
      // Landscape (e.g. 16:9) -> width is 1, height is scaled down proportionally
      videoPlane.setAttribute('width', 1);
      videoPlane.setAttribute('height', (1 / aspectRatio).toFixed(4));
    } else {
      // Portrait (e.g. 9:16) -> height is 1, width is scaled down proportionally
      videoPlane.setAttribute('width', aspectRatio.toFixed(4));
      videoPlane.setAttribute('height', 1);
    }
  }

  videoEl.addEventListener('loadedmetadata', adjustPlaneAspectRatio);

  sceneEl.addEventListener("arReady", () => {
    if (curtain) {
      curtain.style.opacity = "0";
      setTimeout(() => {
        curtain.style.display = "none";
        clearInterval(uiKiller);
      }, 500);
    }
  });

  videoEl.addEventListener('playing', () => {
    adjustPlaneAspectRatio();
    if (videoPlane) videoPlane.setAttribute('visible', 'true');
  });

  target.addEventListener("targetFound", async () => {
    buttonsContainer.style.display = "block";
    
    const fileId = await getLatestVideoId();
    if (fileId) {
      const newSrc = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
      if (videoEl.src !== newSrc) {
        videoEl.src = newSrc;
        videoEl.load();
      }
    }
  });

  target.addEventListener("targetLost", () => {
    buttonsContainer.style.display = "none";
    videoEl.pause();
    if (videoPlane) videoPlane.setAttribute('visible', 'false'); 
    isPlaying = false;
    toggleButton.textContent = "▶️ Play Video";
  });

  toggleButton.addEventListener("click", async () => {
    try {
      if (!isPlaying) {
        videoEl.muted = false; 
        await videoEl.play();
        toggleButton.textContent = "⏸ Pause Video";
        isPlaying = true;
      } else {
        videoEl.pause();
        toggleButton.textContent = "▶️ Play Video";
        isPlaying = false;
      }
    } catch (err) {
      console.error("Playback error:", err);
    }
  });
});

document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
